openapi: 3.1.0

info:
  title: cfduel API
  version: 0.1.0
  description: HTTPS API for cfduel

servers:
  - url: http://localhost:3000/api # CHANGE WITH YOUR FRONTEND API URL

tags:
  - name: auth

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: '^[a-zA-Z0-9_]{3,30}$'
                  description: should contain between 3-30 characters and not contain special charactesr
                email:
                  type: string
                  maxLength: 250
                  pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
                  description: the email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: any character with length from 8-72
                
      responses:
        '201':
          description: Account created
        '400':
          description: Missing or invalid field
        '409':
          description: Username or email already taken
        '500':
          description: Every other errors

  /auth/login:
    post:
      tags: [auth]
      summary: Log in to an existing account
      description: Validates credentials and issues a JWT in an HttpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Registered username
                password:
                  type: string
                  description: Account password
      responses:
        '200':
          description: Login successful; authentication cookie issued
          headers:
            Set-Cookie:
              description: JWT authentication cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  rating:
                    type: integer
        '400':
          description: Missing or invalid input
        '401':
          description: Incorrect username or password
        '403':
          description: Untrusted request origin
        '500':
          description: Internal server error
          
  # REQUIRES COOKIE!!!! credentials: "include" in react
  /auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      description: Verifies the JWT cookie and retrieves the current user profile from PostgreSQL.
      security:
        - cookieAuth: [] 
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  cfHandle:
                    type:
                      - string
                      - 'null'
                  rating:
                    type: integer
        '401':
          description: Missing, invalid, or expired JWT, or user no longer exists
        '500':
          description: Internal server error

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out of the current account
      description: Clears the JWT authentication cookie from the browser.
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out
        '403':
          description: Untrusted request origin
  /cf/verify/start:
    post:
      summary: Start Codeforces handle verification
      description: >
        Generates a verification code for the authenticated user.
        The user must temporarily set their Codeforces first name
        to this code. The code expires after 10 minutes.
        Starting again replaces any previous pending verification.
        Existing linked handles may be replaced after verification.
      tags:
        - Codeforces
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cfHandle
              properties:
                cfHandle:
                  type: string
                  example: tourist
      responses:
        '200':
          description: Verification challenge created
          content:
            application/json:
              schema:
                type: object
                required:
                  - cfCode
                  - expiresAt
                properties:
                  cfCode:
                    type: string
                    example: cfduel_0123456789abcdef
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid Codeforces handle
        '401':
          description: Not authenticated
        '403':
          description: Untrusted request origin
        '404':
          description: User not found
        '409':
          description: Codeforces handle already claimed
        '500':
          description: Internal server error

  /cf/verify/confirm:
    post:
      summary: Confirm Codeforces handle ownership
      description: >
        Checks whether the Codeforces user's first name matches
        the pending verification code. On success, links the
        Codeforces handle to the authenticated account and
        deletes the pending verification. The user may then
        restore their original Codeforces first name.
      tags:
        - Codeforces
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Codeforces handle successfully verified
          content:
            application/json:
              schema:
                type: object
                required:
                  - cfHandle
                properties:
                  cfHandle:
                    type: string
                    example: tourist
        '400':
          description: Codeforces first name does not match verification code
        '401':
          description: Not authenticated
        '403':
          description: Untrusted request origin
        '404':
          description: User, pending verification, or Codeforces handle not found      
        '409':
          description: Codeforces handle already claimed, verification changed, or user has an unfinished duel
        '410':
          description: Verification code expired
        '502':
          description: Codeforces API unavailable or returned an error
        '504':
          description: Codeforces API timed out
        '500':
          description: Internal server error

  /duel:
    post:
      tags: [duel]
      summary: Challenge another user to a duel
      description: >
        Creates a pending duel request with the authenticated user as player1
        (the challenger) and the named user as player2. Both users must have a
        linked Codeforces handle. The opponent is looked up by site username
        (case-insensitive), not by Codeforces handle, and the duel stores the
        opponent's username as it was registered.


        One request at a time: a user cannot send a request while they have
        another unexpired pending request they sent, or while they are a
        player in an active duel. Receiving requests from others does not
        count against this. If the opponent already has an unexpired pending
        request to the challenger, the challenger must answer that one
        instead of sending a new one.


        Expiry: a request expires 10 minutes after it is created (expiresAt)
        if the duel has not started by then. An expired request cannot be
        joined or started, and it no longer counts as pending for the rules
        above, so the challenger can send a new one.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opponentUsername]
              properties:
                opponentUsername:
                  type: string
                  minLength: 1
                  description: Site username of the user to challenge
                  example: boris
      responses:
        '201':
          description: Duel created with status pending
          content:
            application/json:
              schema:
                type: object
                required: [id, expiresAt]
                properties:
                  id:
                    type: string
                    pattern: '^[1-9][0-9]*$'
                    description: Duel id, a string because it may exceed a JS integer
                    example: '42'
                  expiresAt:
                    type: string
                    format: date-time
                    description: When the request expires if the duel has not started (10 minutes after creation)
        '400':
          description: opponentUsername missing, not a string, or empty; or the user challenged themselves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Untrusted request origin, or the challenger has not linked a Codeforces handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No user has this username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This is an invalid user
        '409':
          description: >
            The challenger already has an unexpired pending request, the
            challenger is in an active duel, the opponent already has an
            unexpired pending request to the challenger, or the opponent has
            not linked a Codeforces handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyRequested:
                  value:
                    error: You already have a pending duel request
                inActiveDuel:
                  value:
                    error: You are already in a duel
                opponentAlreadyRequested:
                  value:
                    error: This user has already challenged you
                opponentNoHandle:
                  value:
                    error: This user has not linked a Codeforces handle
        '500':
          description: Internal server error

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
